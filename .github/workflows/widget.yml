name: Build widget APK and publish to VPS

on:
  push:
    branches:
      - main
    paths:
      - "widget/**"
      - ".github/workflows/widget.yml"

permissions:
  contents: read

concurrency:
  group: apk-vps-widget
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if ((${#missing[@]})); then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > widget/app/keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("widget/key.properties").write_text(
              "storeFile=keystore.jks\n"
              f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}\n"
              f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}\n"
          )
          PY

      - name: Build release APK
        working-directory: widget
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fxwidget
          path: widget/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fxwidget
          path: dist

      - name: Copy APK to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$VPS_HOST" ]] || missing+=(VPS_HOST)
          [[ -n "$VPS_USER" ]] || missing+=(VPS_USER)
          [[ -n "$VPS_PATH" ]] || missing+=(VPS_PATH)
          [[ -n "$VPS_SSH_KEY" ]] || missing+=(VPS_SSH_KEY)
          if ((${#missing[@]})); then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$VPS_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_PATH must be an absolute directory without spaces."
            exit 1
          fi
          port="${VPS_SSH_PORT:-22}"
          [[ -n "$port" ]] || port=22

          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -p "$port"
          )
          scp_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -P "$port"
          )

          apk="dist/app-release.apk"
          test -f "$apk"
          quoted_path=$(printf '%q' "$VPS_PATH")
          ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" "mkdir -p ${quoted_path}"
          scp "${scp_opts[@]}" "$apk" "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/fxwidget-bltr.apk.partial"
          ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" \
            "mv -f ${quoted_path}/fxwidget-bltr.apk.partial ${quoted_path}/fxwidget-bltr.apk && chmod 644 ${quoted_path}/fxwidget-bltr.apk"
