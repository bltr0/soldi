name: Build APK and publish to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apk-vps-main
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if ((${#missing[@]})); then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("android/key.properties").write_text(
              "storeFile=keystore.jks\n"
              f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}\n"
              f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}\n"
          )
          PY

      - name: Build release APK
        env:
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          define_args=()
          if [[ -n "${GOOGLE_OAUTH_WEB_CLIENT_ID}" ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("dart_defines.json").write_text(json.dumps({
              "GOOGLE_OAUTH_WEB_CLIENT_ID": os.environ["GOOGLE_OAUTH_WEB_CLIENT_ID"],
          }))
          PY
            define_args+=(--dart-define-from-file=dart_defines.json)
          else
            echo "GOOGLE_OAUTH_WEB_CLIENT_ID is unset; Drive backup will be disabled in this APK."
          fi
          flutter build apk --flavor default --release "${define_args[@]}"
          test -f build/app/outputs/flutter-apk/app-default-release.apk
          rm -f dart_defines.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-default-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Copy APK to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$VPS_HOST" ]] || missing+=(VPS_HOST)
          [[ -n "$VPS_USER" ]] || missing+=(VPS_USER)
          [[ -n "$VPS_PATH" ]] || missing+=(VPS_PATH)
          [[ -n "$VPS_SSH_KEY" ]] || missing+=(VPS_SSH_KEY)
          if ((${#missing[@]})); then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$VPS_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_PATH must be an absolute directory without spaces."
            exit 1
          fi
          port="${VPS_SSH_PORT:-22}"
          [[ -n "$port" ]] || port=22

          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -p "$port"
          )
          scp_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -P "$port"
          )

          apk="dist/app-default-release.apk"
          test -f "$apk"
          quoted_path=$(printf '%q' "$VPS_PATH")
          ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" "mkdir -p ${quoted_path}"
          scp "${scp_opts[@]}" "$apk" "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/sossoldi-bltr.apk.partial"
          ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" \
            "mv -f ${quoted_path}/sossoldi-bltr.apk.partial ${quoted_path}/sossoldi-bltr.apk && chmod 644 ${quoted_path}/sossoldi-bltr.apk"
