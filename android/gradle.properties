org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own daemon; cap it so both fit on CI.
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# No dependency uses the old support libraries (checked with checkJetifier);
# rewriting every jar, the Flutter engine included, ran CI out of memory.
android.enableJetifier=false
android.enableR8.fullMode=false
org.gradle.caching=true
org.gradle.parallel=true
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
